[package]
name = "ashlar-bevy"
description = "Bevy adapters for shared procedural building meshes and materials."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ashlar-bevy"
readme = "README.md"
keywords = ["bevy", "procedural", "architecture", "pbr", "gamedev"]
categories = ["game-development", "graphics"]

# docs.rs shows the tool half as well as the game half: every feature is off by
# default, and a reader looking up `create_graph_material` should not have to work out
# which flag would have compiled it. `--cfg docsrs` is what puts the feature
# badge on a gated item, through the `doc_cfg` the crate root enables.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Nothing is on by default, so `ashlar-bevy` in a game's manifest is the file
# path alone — no material graphs, no bake, and no `ashlar-material` in its tree
# at all. The features below are of two kinds and the difference is the whole
# layering: a **tool** feature pulls the graph engine, and a **game** feature
# does not.
#
# What a game gives up by saying nothing is what it cannot use at play anyway:
# a runtime bake costs hundreds of milliseconds in front of a frame, and a
# compiled surface costs that plus a pipeline. The preview, the content steps
# and this crate's own tests are the callers that want those, and they say so.
#
# `strands` is the one that changed on 2026-09-20. It was a tool feature,
# because a strand layer was scattered from its graph at runtime and had no
# baked form; it has one now — `ashlar_strands::file` — so growing a lawn from
# a file is a game feature and scattering one from a graph is the tool feature
# beside it.
[features]
default = []
# Bake a `Surface::Graph` into `Image` assets at runtime: `runtime_bake`, its
# `BakeCache`, and the full `read_library_with_graphs` preflight that lowers every graph
# a library names. This is the feature that pulls `ashlar-material`, and the one
# the other three are written on top of.
runtime-bake = ["dep:ashlar-material"]
# Run that same bake on the render device instead of the CPU: `gpu`, and
# `Baker::Gpu`. Implies the CPU path because the CPU path is the reference the
# GPU one is checked against, and because a headless caller falls back to it.
gpu-bake = ["runtime-bake"]
# Compile a `Surface::Shader` instead of baking it: `shader`, its
# `ProceduralMaterial` and the plugin that draws one. Implies `runtime-bake`
# because a compiled surface bakes its static half through the same cache.
shader = ["runtime-bake"]
# **A game feature.** Grow geometry from a baked strand set: `strands`, the
# `cards` impostors behind them and the `wind` materials that move both. It
# pulls `ashlar-strands` — the set, the file reader, placement, the mesh builder
# and the card rasteriser — and nothing else. No graph engine: `cargo tree -e
# normal --features strands` has no `ashlar-material` in it, and a test holds
# that.
strands = ["dep:ashlar-strands"]
# **A tool feature.** Scatter a strand set out of a material graph instead of
# reading one off disk: `strands::scatter_sets`, `StrandKey` and the cache
# behind it. Implies both halves, because it is the join between them — a
# scatter answers the sets the game half then grows — and it is what the content
# step that *writes* the files compiles.
strand-scatter = ["strands", "runtime-bake"]

[dependencies]
ashlar.workspace = true
# The whole graph half: lowering one to preflight it, baking one into images,
# partitioning one into a shader, scattering one into strands. Optional, and
# every feature that turns it on is a tool feature — a game drawing baked files
# needs a container header read and no graph engine at all.
ashlar-material = { workspace = true, optional = true }
# The game half of the strand story, behind `strands`: the set a definition
# names, the file it is read from, placement, the mesh builder and the card
# rasteriser. It is `glam`, `serde` and `thiserror` — every one of which a game
# linking `ashlar` already has — and it is deliberately not the graph engine.
ashlar-strands = { workspace = true, optional = true }
# `ktx2` is the container a baked texture set ships in, because it is the one
# that carries a mip chain and PNG does not, and `zstd_rust` is the decoder for
# the supercompression it ships under: `ashlar-material`'s writer compresses
# every level, which takes the study's maps from 94 MB to 24 MB, and a loader
# that cannot inflate them reads nothing. `zstd_rust` rather than `zstd_c` is
# `ruzstd`, pure Rust and decode-only, so a game linking this crate gets no C
# build; the encoder is the other side of the file and lives behind
# `ashlar-material`'s own `zstd` feature, which this crate does not turn on.
bevy = { workspace = true, features = ["std", "bevy_asset", "bevy_mesh", "bevy_render", "bevy_pbr", "bevy_image", "ktx2", "zstd_rust"] }
anyhow.workspace = true
ron.workspace = true
image.workspace = true
# The two things this crate has to say that are not a caller's error to handle:
# a render device it will not bake on, and a deferred camera the generated
# prepass cannot draw to. Both are discovered inside a `Plugin::finish` or a
# render-world `specialize`, where there is nobody to return a `Result` to.
tracing.workspace = true

[dev-dependencies]
# Named once, in the test that says the two crates above it share its values.
ashlar-surface.workspace = true
# The tests decode a real PNG through Bevy's own image loader to see the colour
# space and the sampler `create` asked for. The library only ever names a key.
# `default` on top of that is the windowed half the `building` example needs and
# the library deliberately does not have: a winit window, a surface to present
# to and the default tonemapping LUTs. A dev-dependency is where it belongs —
# a game linking this crate picks its own window features, and an example that
# opens one should not decide them for it.
bevy = { workspace = true, features = ["default", "png"] }
# The encoder, so a test can write the supercompressed file it then asks Bevy's
# loader to read. Only the tests write one; the crate itself reads.
ashlar-material = { workspace = true, features = ["zstd"] }
# The `building` example authors a recipe and has to evaluate it before it can
# upload it. Test-only: this crate consumes meshes and carries no kernel, which
# is the layering its README states, and an example is where the two meet.
ashlar-manifold.workspace = true
tempfile.workspace = true

# The join `AshlarPlugin` makes, done by hand: a meshed building and a material
# library of baked files through `drawables`, no tool features, one window. Its
# own target rather than a doctest because it draws, and `cargo check
# --workspace --all-targets` is what keeps it compiling.
[[example]]
name = "building"
path = "examples/building.rs"

# The production path: a baked `.ashlar` building and an exported material
# library, loaded through the asset server by `AshlarPlugin`, every level of
# detail in its distance band. Featureless, like `building`, and it needs the
# content step's files on disk before it has anything to draw.
[[example]]
name = "baked"
path = "examples/baked.rs"

# The same contract one step along: geometry a game could not ship before the
# baked strand set existed. One feature, one file, no graph engine, and
# `required-features` is what says so — a featureless `cargo check
# --all-targets` leaves it out rather than failing on the module it names.
[[example]]
name = "lawn"
path = "examples/lawn.rs"
required-features = ["strands"]

# Each integration test says which half of the crate it is testing, so that
# `cargo test -p ashlar-bevy` with no features runs the tests that hold
# featureless and skips the ones that cannot exist. Two files are deliberately
# absent from this list. `meshes.rs`, because mesh upload is the game path and
# needs no feature. And `draw.rs`, because it is both: its first case is a claim
# about a build with *no* features in it and would be refused by a
# `required-features` line, while its compiled cases are `#[cfg(feature =
# "shader")]` inside the file and simply are not there without it. `just draw`
# runs it once each way for that reason.
[[test]]
name = "materials"
path = "tests/materials.rs"
required-features = ["runtime-bake"]

[[test]]
name = "shaders"
path = "tests/shaders.rs"
required-features = ["shader"]

[[test]]
name = "conformance"
path = "tests/conformance.rs"
required-features = ["gpu-bake", "shader"]

[lints]
workspace = true
