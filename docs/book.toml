[book]
title = "ashlar"
description = "Procedural buildings and materials for Rust games: recipes, graphs, a content step and a Bevy plugin."
authors = ["Mathias Myrland"]
language = "en"
multilingual = false
# The manual is the docs folder itself, so every chapter reads the same on
# GitHub and on the site.
src = "."

[build]
# A chapter missing from the tree is a broken build, not an empty page.
create-missing = false

[output.html]
git-repository-url = "https://github.com/JedimEmO/ashlar"
edit-url-template = "https://github.com/JedimEmO/ashlar/edit/main/docs/{path}"
site-url = "/ashlar/book/"
no-section-label = true

[output.html.fold]
enable = true
level = 1
