<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ashlar — explorable demo</title>
    <meta name="description" content="Procedural buildings and materials from the ashlar Rust crates, baked and drawn in the browser with Bevy." />
    <!-- The app, built by trunk with the size-first profile in
         .cargo/config.toml, then wasm-opt at -Oz: the renderer is most of the
         download, and a smaller module starts sooner on a slow connection. -->
    <link data-trunk rel="rust" data-bin="ashlar-web" data-cargo-profile="web-release" data-wasm-opt="z" />
    <style>
      :root { color-scheme: dark; --bg: #0c0e12; --ink: #d9d5cc; --muted: #8b8f98; --accent: #d6b270; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
      canvas#ashlar { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; text-align: center;
        pointer-events: none; transition: opacity 0.6s ease; }
      #loading h1 { font-weight: 600; letter-spacing: 0.04em; color: var(--accent); margin: 0 0 0.3em; font-size: 2.2rem; }
      #loading p { margin: 0.2em 0; color: var(--muted); }
      #loading .bar { width: 220px; height: 3px; margin: 1.2em auto 0; background: #1d2027; border-radius: 2px; overflow: hidden; }
      #loading .bar::after { content: ""; display: block; width: 40%; height: 100%; background: var(--accent);
        animation: slide 1.4s ease-in-out infinite; }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      #loading.gone { opacity: 0; }
      noscript { position: fixed; inset: 0; display: grid; place-items: center; }
    </style>
  </head>
  <body>
    <canvas id="ashlar"></canvas>
    <div id="loading">
      <div>
        <h1>ashlar</h1>
        <p>Loading the demo: a Bevy app compiled to WebAssembly.</p>
        <p>It needs WebGL2, and a few seconds on a fast connection.</p>
        <div class="bar"></div>
      </div>
    </div>
    <noscript>The demo is a WebAssembly app and needs JavaScript.</noscript>
    <script>
      // Trunk fires this once the module has started; the first frame follows
      // within a moment, so the overlay fades rather than vanishing.
      addEventListener("TrunkApplicationStarted", () => {
        const loading = document.getElementById("loading");
        setTimeout(() => loading.classList.add("gone"), 800);
        document.getElementById("ashlar").focus();
      });
    </script>
  </body>
</html>
